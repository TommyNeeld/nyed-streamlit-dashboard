name: Sync Current RMS

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
          - backfill

concurrency:
  group: current-rms-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CURRENT_RMS_API_KEY: ${{ secrets.CURRENT_RMS_API_KEY }}
      CURRENT_RMS_SUBDOMAIN: ${{ secrets.CURRENT_RMS_SUBDOMAIN || 'nyed' }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Missing GitHub secret: NEON_DATABASE_URL_PROD" >&2
            exit 1
          fi

          if [[ -z "$CURRENT_RMS_API_KEY" ]]; then
            echo "Missing GitHub secret: CURRENT_RMS_API_KEY" >&2
            exit 1
          fi

      - name: Select sync mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"

          if [[ -z "$MODE" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              MODE="full"
            else
              MODE="incremental"
            fi
          fi
          echo "SYNC_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Run sync
        run: python -m src.sync_current_rms --mode "$SYNC_MODE"

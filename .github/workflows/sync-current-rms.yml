name: Sync Current RMS

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
          - backfill
      database:
        description: "Database target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: current-rms-sync-${{ github.event.inputs.database || 'staging' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CURRENT_RMS_API_KEY: ${{ secrets.CURRENT_RMS_API_KEY }}
      CURRENT_RMS_SUBDOMAIN: ${{ secrets.CURRENT_RMS_SUBDOMAIN || 'nyed' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select sync target
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TARGET="${{ github.event.inputs.database }}"

          if [[ -z "$MODE" ]]; then
            if [[ "${{ github.event.schedule }}" == "17 2 * * *" ]]; then
              MODE="full"
            else
              MODE="incremental"
            fi
          fi

          if [[ -z "$TARGET" ]]; then
            TARGET="staging"
          fi

          if [[ "$TARGET" == "production" ]]; then
            echo "DATABASE_URL=${{ secrets.NEON_DATABASE_URL_PROD }}" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=${{ secrets.NEON_DATABASE_URL_STAGING }}" >> "$GITHUB_ENV"
          fi
          echo "SYNC_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Run sync
        run: python -m src.sync_current_rms --mode "$SYNC_MODE"
